name: micatalogo-local

services:
  app:
    build:
      context: ./api-micatalogo
    image: micatalogo-local-app
    restart: unless-stopped
    env_file: .env.docker.local
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SCHEME: smtp
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  api-web:
    build:
      context: ./api-micatalogo
      dockerfile: docker/nginx/Dockerfile
    image: micatalogo-local-api-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:80"
    networks:
      default:
        aliases: [micatalogo-api-web]
    depends_on:
      - app

  front-web:
    build:
      context: ./front-micatalogo
    image: micatalogo-local-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:80"
    depends_on:
      - api-web

  db:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Use --env-file .env.docker.local}
      MYSQL_USER: ${DB_USERNAME:?Use --env-file .env.docker.local}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Use --env-file .env.docker.local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Use --env-file .env.docker.local}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  database:
