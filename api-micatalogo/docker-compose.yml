version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: micatalogo-app
    container_name: micatalogo-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - micatalogo-net
    depends_on:
      - db
      - mailpit

  web:
    image: nginx:alpine
    container_name: micatalogo-web
    restart: unless-stopped
    ports:
      - "8888:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - micatalogo-net
    depends_on:
      - app

  db:
    image: mariadb:10.6
    container_name: micatalogo-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - micatalogo-db-data:/var/lib/mysql
    networks:
      - micatalogo-net

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: micatalogo-phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    networks:
      - micatalogo-net
    depends_on:
      - db

  mailpit:
    image: axllent/mailpit:latest
    container_name: micatalogo-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - micatalogo-net

networks:
  micatalogo-net:
    driver: bridge

volumes:
  micatalogo-db-data:
